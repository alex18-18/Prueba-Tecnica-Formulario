# ============================================================
# Fidelización de clientes - Configuración Spring Boot
# ============================================================

# Puerto del servidor
server.port=8080

# ===============================
# Conexión a MySQL
# ===============================
# Crea primero la base de datos en MySQL:
#   CREATE DATABASE fidelizacion_clientes;
# Ajusta el usuario y la contraseña según tu instalación.
spring.datasource.url=jdbc:mysql://localhost:3306/fidelizacion_clientes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
# Las tablas las crea schema.sql, por eso ddl-auto queda en "none".
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ===============================
# Inicialización de la base de datos
# ===============================
# Ejecuta src/main/resources/schema.sql y data.sql al iniciar.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8